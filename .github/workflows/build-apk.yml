name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Compilar APK
        run: |
          S=$(find . -name 'settings.gradle*' -not -path './.git/*' | head -n 1)
          if [ -z "$S" ]; then
            Z=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$Z" ]; then
              echo "Descomprimiendo $Z"
              mkdir -p /tmp/proyecto && unzip -q "$Z" -d /tmp/proyecto
              S=$(find /tmp/proyecto -name 'settings.gradle*' | head -n 1)
            fi
          fi
          if [ -z "$S" ]; then
            echo "No encontré el proyecto. Archivos del repo:"; ls -R | head -50; exit 1
          fi
          DIR=$(dirname "$S")
          echo "Proyecto en: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk" && cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apk/"

      - uses: actions/upload-artifact@v4
        with:
          name: Calendario-APK
          path: apk/*.apk
